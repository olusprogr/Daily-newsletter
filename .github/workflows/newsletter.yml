name: Tech Newsletter

on:
  schedule:
    # Every 30 minutes: new articles go out as they appear. GitHub often
    # delays scheduled runs by 5-20 minutes under load, which is fine here -
    # nothing depends on hitting an exact wall-clock time any more.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Auch beim allerersten Lauf senden (statt den Zustand nur zu initialisieren)'
        type: boolean
        default: false
      dry_run:
        description: 'Nur Nachrichten ausgeben, nichts per WhatsApp senden'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tech-newsletter
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send new articles
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m newsletter.main $ARGS

      - name: Commit & push state + archive
        run: |
          git config user.name "tech-newsletter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state digests docs
          if git diff --cached --quiet; then
            echo "Nichts Neues verschickt - nichts zu committen."
            exit 0
          fi
          git commit -m "chore: newsletter state $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Another run (or a manual push) may have landed meanwhile; rebase
          # rather than fail, so a busy day can't wedge the schedule.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $attempt) - rebase und erneut versuchen."
            git pull --rebase origin main || true
            sleep $((attempt * 4))
          done
          echo "::error::Push nach 3 Versuchen fehlgeschlagen."
          exit 1
