name: Schacht Game Build

on:
  push:
    branches:
      - "claude/android-game-offline-8xnrbl"
    paths:
      - "android-game-schacht/**"
      - ".github/workflows/schacht-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android-game-schacht
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: schacht-debug-apk
          path: android-game-schacht/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Der direkte Artefakt-Download (Azure Blob Storage) ist in der
      # Sandbox-Umgebung durch die Netzwerk-Policy blockiert. Deshalb wird die
      # fertige APK zusaetzlich direkt ins Repo committet (Pfad ausserhalb von
      # android-game-schacht/**, damit kein erneuter Build-Trigger entsteht).
      - name: Commit APK back into repository
        run: |
          mkdir -p dist
          cp android-game-schacht/app/build/outputs/apk/debug/app-debug.apk dist/schacht-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/schacht-debug.apk
          if git diff --cached --quiet; then
            echo "Keine Aenderungen an der APK, kein Commit noetig."
          else
            git commit -m "ci: gebaute Schacht-Debug-APK ablegen"
            git push origin HEAD:${{ github.ref_name }}
          fi
