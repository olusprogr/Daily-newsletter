name: Android Game Build

on:
  push:
    branches:
      - "claude/android-game-offline-8xnrbl"
    paths:
      - "android-game/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android-game
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: physik-huepfer-debug-apk
          path: android-game/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Der Sandbox-Build-Umgebung ist der direkte Download von GitHubs
      # Artifact-Speicher (Azure Blob Storage) durch die Netzwerk-Policy
      # untersagt. Deshalb wird die fertige APK zusätzlich direkt ins
      # Repo committet (Pfad außerhalb von android-game/**, damit dies
      # keinen erneuten Build-Trigger auslöst).
      - name: Commit APK back into repository
        run: |
          mkdir -p dist
          cp android-game/app/build/outputs/apk/debug/app-debug.apk dist/physik-huepfer-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/physik-huepfer-debug.apk
          if git diff --cached --quiet; then
            echo "Keine Änderungen an der APK, kein Commit nötig."
          else
            git commit -m "ci: gebaute Debug-APK ablegen"
            git push origin HEAD:${{ github.ref_name }}
          fi
